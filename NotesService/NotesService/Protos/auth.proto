syntax = "proto3";

option csharp_namespace = "NotesService";

package auth;

service UserAuth {
  rpc Login (LoginRequest) returns (LoginReply);
  rpc CreateUser (CreateUserRequest) returns (CreateUserReply);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  bool success = 1;
  string message = 2;
  string token = 3;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
}

message CreateUserReply {
  bool success = 1;
  string message = 2;
}
